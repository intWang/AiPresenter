appId: ringcentral-video
appName: RingCentral Video
version: 1
profileIds:
- ringcentral-video
- ringcentral-video-openai
- ringcentral-video-codex-cli-speaker
- ringcentral-video-bind-speaker
operationEntrypoints:
- id: ringcentral.develop.video.tab
  title: Video tab in RingCentralDevelop
  area: RingCentralDevelop
  purpose: Open the Video meetings surface before starting or joining meetings.
  openSteps:
  - action: focusWindow
    match:
      process: RingCentralDevelop
  - action: clickTab
    target: Video
  presenterNotes:
  - Use this as the first entry point when the user asks to start from the desktop app.
  - The app must already be logged in.
- id: ringcentral.develop.video.start
  title: Start meeting
  area: RingCentralDevelop Video tab
  purpose: Start an instant RingCentral Video meeting.
  openSteps:
  - action: clickButton
    target: Start
  presenterNotes:
  - Starting a meeting creates the independent RingCentralVideo process.
  - Bind the meeting window by process RingCentralVideo and class RingCentralVideoClass.
- id: ringcentral.video.overview
  title: Meeting overview
  area: Meeting window
  purpose: Introduce the RingCentral Video meeting surface before opening individual controls.
  openSteps: []
  presenterNotes:
  - Use this as the narrative bridge before walking through specific controls.
  - No UI action is required for this step.
  - In a two-person meeting, the center canvas shows participant tiles and the Participants badge shows the live
    attendee count, so demos should inspect state before assuming an empty-room invite path.
- id: ringcentral.video.top.meeting-info
  title: Meeting information
  area: Meeting top bar
  purpose: Open meeting details including meeting title, host, meeting ID, copy link, dial-in info, encryption,
    and end-to-end encryption option.
  openSteps:
  - action: clickWindowRelative
    target: Meeting information
    match:
      x: '31'
      y: '21'
      cleanup: escape
  presenterNotes:
  - Observed behind the information icon at the top left of the meeting window.
  - The popover can expose private meeting identifiers and copy-link controls; summarize purpose unless the user
    asks for exact values.
  - Close the popover with Escape before moving to another toolbar control.
- id: ringcentral.video.top.network-quality
  title: Network quality
  area: Meeting top bar
  purpose: Show diagnostic network quality for sharing, video, and audio, including packet loss, jitter, and latency.
  openSteps:
  - action: clickWindowRelative
    target: Network quality
    match:
      x: '68'
      y: '21'
      cleanup: escape
  presenterNotes:
  - Observed behind the signal bars icon at the top left.
  - Use this entry point when explaining call health or troubleshooting audio/video quality.
  - Close the popover with Escape before clicking another control.
- id: ringcentral.video.top.views
  title: View layout menu
  area: Meeting top bar
  purpose: Switch the meeting layout, including Gallery view and Full screen.
  openSteps:
  - action: clickWindowRelative
    target: Views
    match:
      xFromRight: '237'
      y: '21'
      cleanup: escape
  presenterNotes:
  - Observed options include Gallery and Full screen.
  - This changes presentation layout, not meeting membership or media state.
  - Close the menu with Escape after explaining it.
- id: ringcentral.video.top.report-issue
  title: Report issue
  area: Meeting top bar
  purpose: Open the issue reporting dialog for Audio, Video, Screen sharing, Meeting join, Notes and transcript,
    or Other.
  openSteps:
  - action: clickWindowRelative
    target: Report
    match:
      xFromRight: '168'
      y: '21'
      cleanup: modal
  presenterNotes:
  - This opens a foreground dialog that blocks every other meeting control until closed.
  - Do not pick an issue category during a feature tour unless the user wants to file a report.
  - Close using the dialog X before continuing; Escape alone did not reliably clear this dialog during testing.
- id: ringcentral.video.main.add-coworkers
  title: Add coworkers
  area: Meeting canvas
  purpose: Open the Invite others dialog from the empty-meeting callout.
  openSteps:
  - action: clickWindowRelative
    target: Add coworkers
    match:
      x: '461'
      y: '462'
      cleanup: modal
  presenterNotes:
  - The dialog includes a name/email field, suggestions, Copy meeting link, Cancel, and Invite.
  - This is functionally similar to the Invite toolbar control.
  - This callout only appears in the empty-room "first one here" state; skip it when participant tiles or a
    Participants badge count show other attendees are already present.
  - Close using the dialog X or Cancel before touching other controls; the dialog blocks the toolbar.
- id: ringcentral.video.toolbar.audio
  title: Microphone control
  area: Meeting toolbar
  purpose: Toggle mute and unmute in the live meeting.
  openSteps:
  - action: clickWindowControl
    target: Mute
    match:
      alternateTargets: Unmute
      controlType: button
  presenterNotes:
  - Button text alternates between Unmute and Mute depending on current state.
  - Use this entry point to explain audio privacy and meeting readiness.
- id: ringcentral.video.toolbar.audio-menu
  title: Microphone and speaker menu
  area: Meeting toolbar
  purpose: Open microphone and speaker device controls, audio level indicators, leave-computer-audio, phone-audio,
    and more audio settings.
  openSteps:
  - action: clickWindowControl
    target: More
    match:
      occurrence: '1'
      controlType: button
      cleanup: escape
  presenterNotes:
  - Observed menu sections include Microphone, Speaker, Leave computer audio, Use phone audio, and More audio settings.
  - Use this when explaining how to recover from the wrong microphone or speaker.
  - If a system-default-audio-devices toast appears, close it only when visible; its close coordinate overlaps Add
    coworkers on the clean main screen.
- id: ringcentral.video.toolbar.video
  title: Camera control
  area: Meeting toolbar
  purpose: Toggle local camera on or off.
  openSteps:
  - action: clickWindowControl
    target: Start video
    match:
      alternateTargets: Stop video
      controlType: button
  presenterNotes:
  - Button text alternates between Start video and Stop video.
  - The caret next to this button exposes camera and video settings.
- id: ringcentral.video.toolbar.video-menu
  title: Camera menu
  area: Meeting toolbar
  purpose: Open camera device selection and the More video settings shortcut.
  openSteps:
  - action: clickWindowControl
    target: More
    match:
      occurrence: '2'
      controlType: button
      cleanup: escape
  presenterNotes:
  - Observed menu includes the selected camera and More video settings.
  - Use More video settings for background, quality, and camera configuration.
  - Close the menu with Escape when the tour is only explaining the entry point.
- id: ringcentral.video.settings.video
  title: More video settings
  area: Video menu
  purpose: Open camera, quality, gallery, and related video settings.
  openSteps:
  - action: clickWindowControl
    target: More
    match:
      occurrence: '2'
      controlType: button
  - action: clickWindowControl
    target: More video settings
    match:
      cleanup: settings
  presenterNotes:
  - This route opens the Settings dialog directly on the Video panel.
  - Use it before explaining camera device selection and HD settings.
- id: ringcentral.video.settings.background
  title: Background settings
  area: Settings
  purpose: Configure blur, built-in virtual backgrounds, video backgrounds, or custom uploads.
  openSteps:
  - action: clickWindowControl
    target: More
    match:
      occurrence: '3'
      controlType: button
  - action: clickWindowControl
    target: Background
    match:
      cleanup: settings
  presenterNotes:
  - Blur protects the real environment while keeping the presenter visible.
  - The plus tile adds a custom background asset.
- id: ringcentral.video.settings.background.blur
  title: Select blur background
  area: Background settings
  purpose: Select Blur from the Background settings panel.
  openSteps:
  - action: clickWindowControl
    target: More
    match:
      occurrence: '3'
      controlType: button
  - action: clickWindowControl
    target: Background
  - action: clickWindowControl
    target: Blur
    match:
      cleanup: settings
  presenterNotes:
  - This is the actual Blur selection action, not just the route to the Background panel.
  - Use it only when the user wants the presenter to change the local background effect.
- id: ringcentral.video.toolbar.share
  title: Screen sharing
  area: Meeting toolbar
  purpose: Start sharing a screen, window, or selected content.
  openSteps:
  - action: clickWindowControl
    target: Share
    match:
      controlType: button
      cleanup: escape
  presenterNotes:
  - Narration must not infer shared-screen content unless verified by an allowed source.
  - Use this entry point to explain presenter handoff and collaboration.
  - Observed share picker includes entire screen, application windows, Share system audio, and Share.
  - Do not click the final Share button during a control tour unless the user explicitly asks to start sharing.
- id: ringcentral.video.toolbar.invite
  title: Invite participants
  area: Meeting toolbar
  purpose: Invite coworkers or copy meeting details.
  openSteps:
  - action: clickWindowControl
    target: Invite
    match:
      controlType: button
      cleanup: modal
  presenterNotes:
  - Useful when the presenter needs to explain how to bring people into an active room.
  - Avoid reading private invite links aloud unless explicitly requested.
  - Opens the same Invite others dialog as Add coworkers, with search, suggestions, Copy meeting link, Cancel, and
    Invite.
  - Close using the dialog X or Cancel before continuing.
- id: ringcentral.video.toolbar.participants
  title: Participants panel
  area: Meeting toolbar
  purpose: Open participant list and meeting people controls.
  openSteps:
  - action: clickWindowControl
    target: Participants
    match:
      controlType: button
      cleanup: toggle
  presenterNotes:
  - Use this to answer questions about attendee count and meeting control.
  - Do not identify participants unless the UI text is verified and allowed.
  - Observed panel has Participant and Chat tabs, search, invite, lock, mute, raise-hand, and more controls.
  - Toggle the Participants button or close the side panel before opening Chat.
- id: ringcentral.video.toolbar.chat
  title: Chat panel
  area: Meeting toolbar
  purpose: Open in-meeting chat.
  openSteps:
  - action: clickWindowControl
    target: Chat
    match:
      controlType: button
      cleanup: toggle
  presenterNotes:
  - Chat is a collaboration side panel for meeting messages.
  - Do not read private chat text aloud unless the user explicitly asks.
  - Observed panel has Within everyone and Privately tabs plus a message box.
  - Toggle the Chat button or close the side panel before continuing.
- id: ringcentral.video.toolbar.react
  title: Reactions
  area: Meeting toolbar
  purpose: Send meeting reactions without interrupting speech.
  openSteps:
  - action: clickWindowControl
    target: React
    match:
      controlType: button
      cleanup: escape
  presenterNotes:
  - Reactions are lightweight feedback signals.
  - This is a good fallback when the presenter wants to acknowledge without opening a panel.
  - Observed reactions include heart, thumbs up, celebration, clap, smile, and Be right back.
  - Close the reaction strip with Escape if no reaction should be sent.
- id: ringcentral.video.toolbar.raise-hand
  title: Raise hand
  area: Meeting toolbar
  purpose: Raise or lower hand to request attention.
  openSteps:
  - action: clickWindowControl
    target: Raise hand
    match:
      alternateTargets: onconf.reactions.REMOVE_RAISE_HAND
      controlType: button
      cleanup: toggle
  presenterNotes:
  - Use this in moderated meeting demos.
  - The button toggles state; when active, a hand indicator appears and the toolbar button changes emphasis.
  - Click again to lower the hand after demonstrating it.
- id: ringcentral.video.toolbar.more
  title: More actions
  area: Meeting toolbar
  purpose: Open additional meeting actions.
  openSteps:
  - action: clickWindowControl
    target: More
    match:
      occurrence: '3'
      controlType: button
      cleanup: escape
  presenterNotes:
  - This is the expansion point for less frequent meeting tools.
  - In the current observed two-person meeting layout, Notes is a direct toolbar button, while More keeps Start
    recording, Background, and Settings.
  - Close the menu with Escape before continuing.
- id: ringcentral.video.more.recording
  title: Start recording
  area: More menu
  purpose: Start recording the meeting.
  openSteps: []
  presenterNotes:
  - Observed under More as Start recording.
  - Treat this as a state-changing action during a tour.
  - AiPresenter should explain this entry without clicking it unless the user explicitly asks to start recording.
- id: ringcentral.video.more.notes
  title: Notes and transcript
  area: Meeting toolbar
  purpose: Open the Notes and Transcript side panel.
  openSteps:
  - action: clickWindowControl
    target: More
    match:
      occurrence: '3'
      controlType: button
  - action: clickWindowControl
    target: Notes
    match:
      controlType: menuitem
      cleanup: sidePanel
  presenterNotes:
  - In the current observed build, Notes is nested under the More menu.
  - Older layouts may expose Notes directly on the toolbar; prefer the More menu route when a direct Notes button is absent.
  - Observed panel offers Start notes and Also record this meeting.
  - Starting notes or recording changes meeting state, so the default tour only explains the panel.
  - Close the panel before continuing.
- id: ringcentral.video.more.background
  title: Background
  area: More menu
  purpose: Open the Settings dialog directly on the Background tab.
  openSteps:
  - action: clickWindowControl
    target: More
    match:
      occurrence: '3'
      controlType: button
  - action: clickWindowControl
    target: Background
    match:
      cleanup: settings
  presenterNotes:
  - Observed Settings dialog tabs include Audio, Video, Background, Translation, Join preferences, and General.
  - Background includes Off, Blur, built-in static backgrounds, video backgrounds, upload, and Mirror my video.
  - Close the Settings dialog using its top-right X before continuing.
- id: ringcentral.video.more.settings
  title: Settings
  area: More menu
  purpose: Open the Settings dialog.
  openSteps:
  - action: clickWindowControl
    target: More
    match:
      occurrence: '3'
      controlType: button
  - action: clickWindowControl
    target: Settings
    match:
      cleanup: settings
  presenterNotes:
  - Observed Settings dialog opens to the current or last selected section.
  - Use this as the general route for audio, video, background, translation, join preferences, and general settings.
  - Close the Settings dialog using its top-right X before continuing.
- id: ringcentral.video.toolbar.leave
  title: Leave meeting
  area: Meeting toolbar
  purpose: Leave or end the meeting.
  openSteps: []
  presenterNotes:
  - Treat this as destructive during a tour.
  - In this test build, clicking Leave can immediately show the left-meeting state, so AiPresenter should explain
    this control without clicking it unless the user explicitly asks to end the meeting.
  - Use a verbal confirmation before performing any leave or end action.
demoFlows:
- id: vbg-blur-demo
  title: Virtual background blur demo
  goal: Show how to protect the real environment using blur and verify it in the live meeting.
  steps:
  - id: open-video-settings
    title: Open video settings
    action:
      entrypointId: ringcentral.video.settings.video
      operation: open
    narration:
      text: I am opening the video settings from the camera control so we can configure the visual presentation.
      placement: before
  - id: open-background-panel
    title: Open background panel
    action:
      entrypointId: ringcentral.video.settings.background
      operation: open
    narration:
      text: The Background panel contains blur, built-in virtual backgrounds, and custom background upload.
      placement: during
      actionOffsetMs: 400
  - id: select-blur
    title: Select blur
    action:
      entrypointId: ringcentral.video.settings.background.blur
      operation: select
      target: Blur
    narration:
      text: Blur keeps the presenter visible while reducing detail from the real room.
      placement: during
      actionOffsetMs: 300
  - id: verify-meeting-video
    title: Verify live meeting video
    action:
      entrypointId: ringcentral.video.toolbar.video
      operation: verify
      target: Stop video
    narration:
      text: Back in the meeting, the live tile confirms video is on and the real background is blurred.
      placement: after
- id: meeting-basics-demo
  title: Meeting basics demo
  goal: Show the core controls a presenter usually needs in a live meeting.
  steps:
  - id: show-mic
    title: Show microphone control
    action:
      entrypointId: ringcentral.video.toolbar.audio
      operation: point
    narration:
      text: The microphone control shows whether local audio is muted and lets the presenter quickly recover before
        speaking.
      placement: before
  - id: show-participants
    title: Show participants
    action:
      entrypointId: ringcentral.video.toolbar.participants
      operation: open
    narration:
      text: The Participants panel is the fastest way to confirm who is in the room and whether the meeting is still
        empty.
      placement: during
      actionOffsetMs: 300
  - id: show-chat
    title: Show chat
    action:
      entrypointId: ringcentral.video.toolbar.chat
      operation: open
    narration:
      text: Chat supports side-channel collaboration while the spoken demo continues.
      placement: during
      actionOffsetMs: 300
- id: meeting-controls-tour
  title: Meeting controls tour
  goal: Give a complete, natural English tour of RingCentral Video meeting controls while synchronizing narration
    with safe UI actions.
  steps:
  - id: meeting-overview
    title: Meeting overview
    action:
      entrypointId: ringcentral.video.overview
      operation: explain
    narration:
      text: RingCentral Video is organized around the live meeting canvas. The top bar covers meeting identity,
        connection health, layout, and reporting. The bottom toolbar covers audio, video, sharing, people, chat,
        reactions, and safety actions.
      placement: before
  - id: explain-meeting-info
    title: Meeting information
    action:
      entrypointId: ringcentral.video.top.meeting-info
      operation: open
    narration:
      text: 'First, the info button opens meeting details: host, meeting ID, copy link, dial-in information, and
        encryption status. I treat those values as private unless you ask for them.'
      placement: during
      actionOffsetMs: 400
  - id: explain-network-quality
    title: Network quality
    action:
      entrypointId: ringcentral.video.top.network-quality
      operation: open
    narration:
      text: Next is network quality. This is where you check packet loss, jitter, and latency for sharing, video,
        and audio when the meeting feels unstable.
      placement: during
      actionOffsetMs: 350
  - id: explain-view-layout
    title: View layout
    action:
      entrypointId: ringcentral.video.top.views
      operation: open
    narration:
      text: Views changes how you see the meeting. It includes Gallery view and Full screen, so it affects layout
        without changing anyone in the call.
      placement: during
      actionOffsetMs: 350
  - id: explain-report-issue
    title: Report issue
    action:
      entrypointId: ringcentral.video.top.report-issue
      operation: open
    narration:
      text: Report opens the troubleshooting dialog for audio, video, screen sharing, joining, notes, transcript,
        or other issues. It blocks the meeting controls, so I close it before moving on.
      placement: during
      actionOffsetMs: 450
  - id: explain-add-coworkers
    title: Add coworkers
    action:
      entrypointId: ringcentral.video.main.add-coworkers
      operation: open
    narration:
      text: Moving into people controls, Add coworkers opens the invite dialog from the empty meeting view. You can
        search for a coworker, copy the meeting link, or send an invite.
      placement: during
      actionOffsetMs: 400
  - id: explain-invite
    title: Invite
    action:
      entrypointId: ringcentral.video.toolbar.invite
      operation: open
    narration:
      text: The Invite button in the toolbar opens the same invite flow. It is the regular place to bring someone
        into an active meeting.
      placement: during
      actionOffsetMs: 350
  - id: explain-participants
    title: Participants
    action:
      entrypointId: ringcentral.video.toolbar.participants
      operation: open
    narration:
      text: Participants opens the roster panel. From here you can confirm who is in the room and access people
        controls such as invite, lock, mute, and more options.
      placement: during
      actionOffsetMs: 350
  - id: explain-chat
    title: Chat
    action:
      entrypointId: ringcentral.video.toolbar.chat
      operation: open
    narration:
      text: Chat opens the message panel. It supports messages to everyone and private conversations, but I do not
        read chat content unless you ask.
      placement: during
      actionOffsetMs: 350
  - id: explain-microphone
    title: Microphone
    action:
      entrypointId: ringcentral.video.toolbar.audio
      operation: point
    narration:
      text: Now the media controls. Mute is the main privacy switch for your microphone. Before speaking, this is
        the first control to check.
      placement: before
  - id: explain-audio-menu
    title: Audio menu
    action:
      entrypointId: ringcentral.video.toolbar.audio-menu
      operation: open
    narration:
      text: The microphone arrow opens audio devices. You can switch microphone and speaker, leave computer audio,
        use phone audio, or go to more audio settings.
      placement: during
      actionOffsetMs: 350
  - id: explain-camera
    title: Camera
    action:
      entrypointId: ringcentral.video.toolbar.video
      operation: point
    narration:
      text: Start video turns on your local camera. Once the camera is on, the same control becomes Stop video.
      placement: before
  - id: explain-camera-menu
    title: Camera menu
    action:
      entrypointId: ringcentral.video.toolbar.video-menu
      operation: open
    narration:
      text: The camera arrow opens camera selection and a shortcut to more video settings, including background
        configuration.
      placement: during
      actionOffsetMs: 350
  - id: explain-share
    title: Share
    action:
      entrypointId: ringcentral.video.toolbar.share
      operation: open
    narration:
      text: Share opens the picker for your screen or application windows. It can also share system audio, but I
        do not press the final Share button unless you confirm.
      placement: during
      actionOffsetMs: 400
  - id: explain-reactions
    title: Reactions
    action:
      entrypointId: ringcentral.video.toolbar.react
      operation: open
    narration:
      text: For lightweight interaction, React opens quick feedback such as heart, thumbs up, celebration, clap,
        smile, and Be right back.
      placement: during
      actionOffsetMs: 350
  - id: explain-raise-hand
    title: Raise hand
    action:
      entrypointId: ringcentral.video.toolbar.raise-hand
      operation: toggle
    narration:
      text: Raise hand signals that you want attention without speaking over someone. It is a toggle, so I lower
        the hand again after showing it.
      placement: during
      actionOffsetMs: 350
  - id: explain-more
    title: More actions
    action:
      entrypointId: ringcentral.video.toolbar.more
      operation: open
    narration:
      text: Finally, More is the expansion menu for deeper meeting tools. In this build, Notes is already on the
        toolbar, while More keeps Start recording, Background, and Settings.
      placement: during
      actionOffsetMs: 350
  - id: explain-recording
    title: Recording
    action:
      entrypointId: ringcentral.video.more.recording
      operation: explain
    narration:
      text: Start recording changes the meeting state, so I only explain it in a tour. I would ask before starting
        or stopping recording.
      placement: before
  - id: explain-notes
    title: Notes and transcript
    action:
      entrypointId: ringcentral.video.more.notes
      operation: open
    narration:
      text: Notes opens the Notes and Transcript panel. It can start meeting notes and can also record the meeting,
        so those actions stay under user control.
      placement: during
      actionOffsetMs: 400
  - id: explain-background-settings
    title: Background settings
    action:
      entrypointId: ringcentral.video.more.background
      operation: open
    narration:
      text: Background opens the settings page for visual presentation. You can turn effects off, blur the room,
        choose a built-in background, use a video background, or upload your own.
      placement: during
      actionOffsetMs: 400
  - id: explain-settings
    title: Settings
    action:
      entrypointId: ringcentral.video.more.settings
      operation: open
    narration:
      text: 'Settings is the complete configuration area: audio, video, background, translation, join preferences,
        and general meeting preferences.'
      placement: during
      actionOffsetMs: 400
  - id: explain-leave
    title: Leave meeting
    action:
      entrypointId: ringcentral.video.toolbar.leave
      operation: explain
    narration:
      text: Leave exits the meeting. It is a destructive control, so the presenter explains it but does not click
        it without explicit confirmation.
      placement: before
- id: meeting-control-map-demo
  title: Meeting Control Map
  goal: >-
    Teach RingCentral Video meeting controls as a coherent map: status, people, media, interaction,
    advanced tools, and closeout.
  steps:
  - id: control-map-overview
    title: Orient the meeting surface
    action:
      entrypointId: ringcentral.video.overview
      operation: explain
    narration:
      text: Think of this meeting window as a control map. The top tells you status and health, the center is the
        live meeting canvas, and the bottom is where you manage people, media, sharing, reactions, and exit.
      placement: before
  - id: control-map-meeting-info
    title: Meeting information
    action:
      entrypointId: ringcentral.video.top.meeting-info
      operation: open
    narration:
      text: Starting at the top, meeting information answers the identity question. It shows the meeting details,
        link, dial-in options, and encryption information, so I summarize it without reading private values aloud.
      placement: during
      actionOffsetMs: 350
  - id: control-map-network
    title: Network quality
    action:
      entrypointId: ringcentral.video.top.network-quality
      operation: open
    narration:
      text: Next is meeting health. Network quality is where you check whether audio, video, or sharing problems
        are coming from packet loss, jitter, or latency.
      placement: during
      actionOffsetMs: 350
  - id: control-map-views
    title: View layout
    action:
      entrypointId: ringcentral.video.top.views
      operation: open
    narration:
      text: Views controls how the meeting is arranged on your screen. It changes layout, like gallery or full
        screen, without changing anyone's audio, video, or membership.
      placement: during
      actionOffsetMs: 350
  - id: control-map-report
    title: Report issue
    action:
      entrypointId: ringcentral.video.top.report-issue
      operation: open
    narration:
      text: Report issue is the escalation path when something is wrong with audio, video, sharing, joining,
        notes, or transcript. Because it opens a blocking dialog, I close it before continuing.
      placement: during
      actionOffsetMs: 400
  - id: control-map-add-coworkers
    title: Add coworkers
    action:
      entrypointId: ringcentral.video.main.add-coworkers
      operation: open
    narration:
      text: Moving from status into people, Add coworkers opens the invite dialog from the empty room. This is the
        fastest way to bring someone in when you are the first person here.
      placement: during
      actionOffsetMs: 350
  - id: control-map-participants
    title: Participants
    action:
      entrypointId: ringcentral.video.toolbar.participants
      operation: open
    narration:
      text: Participants is the meeting roster. It helps you confirm who is present and exposes people controls
        like invite, lock, mute, raise hand, and more options.
      placement: during
      actionOffsetMs: 350
  - id: control-map-chat
    title: Chat
    action:
      entrypointId: ringcentral.video.toolbar.chat
      operation: open
    narration:
      text: Chat is the written side channel. Use it for links, follow-ups, and private messages, while keeping
        chat content private unless you explicitly ask me to read it.
      placement: during
      actionOffsetMs: 350
  - id: control-map-microphone
    title: Microphone
    action:
      entrypointId: ringcentral.video.toolbar.audio
      operation: point
    narration:
      text: Now we move into media readiness. The microphone button is the main privacy switch for speaking, so it
        is the first control to check before you contribute.
      placement: before
  - id: control-map-audio-menu
    title: Audio menu
    action:
      entrypointId: ringcentral.video.toolbar.audio-menu
      operation: open
    narration:
      text: The audio menu is the recovery tool when sound is wrong. It lets you switch microphone and speaker,
        leave computer audio, use phone audio, or open deeper audio settings.
      placement: during
      actionOffsetMs: 350
  - id: control-map-camera
    title: Camera
    action:
      entrypointId: ringcentral.video.toolbar.video
      operation: point
    narration:
      text: The camera button controls whether others can see you. Once video is on, the same area becomes the
        stop-video control.
      placement: before
  - id: control-map-camera-menu
    title: Camera menu
    action:
      entrypointId: ringcentral.video.toolbar.video-menu
      operation: open
    narration:
      text: The camera menu lets you choose the camera and jump to video settings. It is the practical route for
        device changes and appearance setup.
      placement: during
      actionOffsetMs: 350
  - id: control-map-share
    title: Share
    action:
      entrypointId: ringcentral.video.toolbar.share
      operation: open
    narration:
      text: Share opens the picker for screen or application sharing. I can explain the choices, but I do not press
        the final Share button unless you confirm what should be shown.
      placement: during
      actionOffsetMs: 400
  - id: control-map-reactions
    title: Reactions
    action:
      entrypointId: ringcentral.video.toolbar.react
      operation: open
    narration:
      text: For lightweight interaction, Reactions gives quick feedback such as approval, celebration, applause,
        or be-right-back without interrupting the speaker.
      placement: during
      actionOffsetMs: 350
  - id: control-map-raise-hand
    title: Raise hand
    action:
      entrypointId: ringcentral.video.toolbar.raise-hand
      operation: toggle
    narration:
      text: Raise hand is for moderated conversation. It signals that you want attention, and because it is a
        toggle, I lower the hand again after showing it.
      placement: during
      actionOffsetMs: 350
  - id: control-map-more
    title: More actions
    action:
      entrypointId: ringcentral.video.toolbar.more
      operation: open
    narration:
      text: Finally, More is the advanced shelf. Since Notes is already on the toolbar here, More gathers riskier
        or less frequent tools such as recording, background, and settings.
      placement: during
      actionOffsetMs: 350
  - id: control-map-recording
    title: Recording
    action:
      entrypointId: ringcentral.video.more.recording
      operation: explain
    narration:
      text: Recording changes the meeting state and may affect consent, so it is explain-only in this tour. I would
        ask before starting or stopping it.
      placement: before
  - id: control-map-notes
    title: Notes and transcript
    action:
      entrypointId: ringcentral.video.more.notes
      operation: open
    narration:
      text: Notes and Transcript is where meeting notes can be started. It can also record the meeting, so I keep
        the panel visible for explanation and avoid starting anything automatically.
      placement: during
      actionOffsetMs: 400
  - id: control-map-background
    title: Background settings
    action:
      entrypointId: ringcentral.video.more.background
      operation: open
    narration:
      text: Background settings protect presentation quality and privacy. You can turn effects off, blur the room,
        use a built-in image or video background, or upload your own.
      placement: during
      actionOffsetMs: 400
  - id: control-map-settings
    title: Settings
    action:
      entrypointId: ringcentral.video.more.settings
      operation: open
    narration:
      text: Settings is the full configuration center for audio, video, background, translation, join preferences,
        and general meeting behavior.
      placement: during
      actionOffsetMs: 400
  - id: control-map-leave
    title: Leave meeting
    action:
      entrypointId: ringcentral.video.toolbar.leave
      operation: explain
    narration:
      text: Leave is the exit path. It can end your presence in the meeting, so I describe it but do not click it
        without explicit confirmation.
      placement: before
  - id: control-map-summary
    title: Control map summary
    action:
      entrypointId: ringcentral.video.overview
      operation: explain
    narration:
      text: >-
        That is the control map: top bar for status and troubleshooting, people controls for collaboration,
        media controls for readiness, interaction controls for feedback, and More for deeper settings and riskier
        actions.
      placement: before
explainers:
  ringcentralLaunch:
    shortScript: The RingCentral desktop Video tab and Start button are the pre-meeting path into an instant
      RingCentral Video session.
    details:
    - Use the Video tab to orient the user before the independent meeting window opens.
    - Start creates or joins the RingCentralVideo meeting process, so confirm login state first.
    relatedEntrypointIds:
    - ringcentral.develop.video.tab
    - ringcentral.develop.video.start
  meetingOverview:
    shortScript: Meeting overview frames the main surface before individual buttons are opened.
    details:
    - Use it as the bridge from overall layout to specific controls.
    - Inspect participant count and visible tiles before assuming the meeting is empty.
    relatedEntrypointIds:
    - ringcentral.video.overview
  meetingInfo:
    shortScript: Meeting information opens meeting identity, link, dial-in, and encryption details.
    details:
    - Treat meeting IDs, links, and dial-in details as sensitive by default.
    - Use this entry point when the user asks where to find meeting details.
    relatedEntrypointIds:
    - ringcentral.video.top.meeting-info
  networkQuality:
    shortScript: Network quality shows whether audio, video, or sharing is being affected by packet loss, jitter,
      or latency.
    details:
    - Use it for troubleshooting instead of guessing why media feels unstable.
    - Summarize the status unless the user asks for exact diagnostics.
    relatedEntrypointIds:
    - ringcentral.video.top.network-quality
  viewLayout:
    shortScript: View layout controls how the meeting canvas is arranged, including gallery-style viewing and
      full-screen presentation.
    details:
    - Use it when the user asks how to see more people or change the meeting view.
    - Avoid changing full-screen state unless the demo flow expects it.
    relatedEntrypointIds:
    - ringcentral.video.top.views
  reportIssue:
    shortScript: Report issue opens a foreground troubleshooting dialog for reporting meeting problems.
    details:
    - Treat it as a support workflow, not a normal tour destination.
    - Close or cancel the dialog before continuing with other controls.
    relatedEntrypointIds:
    - ringcentral.video.top.report-issue
  invite:
    shortScript: Invite and Add coworkers open the same invite dialog for searching people or copying the meeting
      link.
    details:
    - Close the invite dialog before touching other meeting controls.
    - Avoid reading invite links aloud unless requested.
    relatedEntrypointIds:
    - ringcentral.video.main.add-coworkers
    - ringcentral.video.toolbar.invite
  audio:
    shortScript: The audio controls cover mute state, microphone choice, speaker choice, computer audio, phone audio,
      and more audio settings.
    details:
    - Start with Mute/Unmute when explaining privacy.
    - Use the caret menu when explaining device recovery.
    relatedEntrypointIds:
    - ringcentral.video.toolbar.audio
    - ringcentral.video.toolbar.audio-menu
  video:
    shortScript: The video controls start or stop the camera and expose camera selection plus more video settings.
    details:
    - Use the main button for on/off state.
    - Use the caret for camera device and settings.
    relatedEntrypointIds:
    - ringcentral.video.toolbar.video
    - ringcentral.video.toolbar.video-menu
  videoSettings:
    shortScript: More video settings opens camera-oriented configuration such as camera choice, background access,
      and video behavior.
    details:
    - Use it when the user needs durable camera settings rather than a quick toolbar toggle.
    - Close the settings window before returning to toolbar controls.
    relatedEntrypointIds:
    - ringcentral.video.settings.video
  reactions:
    shortScript: Reactions sends lightweight meeting feedback without interrupting the speaker.
    details:
    - Use it to explain nonverbal responses such as emoji reactions.
    - Mention that reactions are visible meeting signals, not private notes.
    relatedEntrypointIds:
    - ringcentral.video.toolbar.react
  raiseHand:
    shortScript: Raise hand signals that the participant wants attention without speaking over the meeting.
    details:
    - Explain both raise and lower states because the same control toggles.
    - Use it as the safer alternative to interrupting with audio.
    relatedEntrypointIds:
    - ringcentral.video.toolbar.raise-hand
  moreMenu:
    shortScript: More is the overflow hub for secondary meeting actions such as recording, notes, background,
      settings, and leaving.
    details:
    - Open it as a navigation step, then choose the specific action intentionally.
    - Treat destructive or state-changing actions inside More with confirmation.
    relatedEntrypointIds:
    - ringcentral.video.toolbar.more
  notes:
    shortScript: Notes opens the Notes and Transcript panel, but starting notes or recording changes meeting state.
    details:
    - Use this to show where meeting notes live.
    - Do not start notes or enable recording unless the user asks.
    relatedEntrypointIds:
    - ringcentral.video.more.notes
  recording:
    shortScript: Start recording is available from More and should be treated as a confirmed action, not a passive
      tour step.
    details:
    - Explain it without clicking during normal demos.
    - Ask for confirmation before starting or stopping recording.
    relatedEntrypointIds:
    - ringcentral.video.more.recording
  background:
    shortScript: Background controls let the presenter switch between no effect, blur, built-in backgrounds, and
      custom uploads.
    details:
    - Use Blur when privacy is more important than visual branding.
    - Use a built-in or uploaded image when the demo needs a branded or neutral scene.
    relatedEntrypointIds:
    - ringcentral.video.settings.background
    - ringcentral.video.settings.background.blur
    - ringcentral.video.more.background
  settingsHub:
    shortScript: Settings is the full meeting configuration center for audio, video, background, translation, join
      preferences, and general behavior.
    details:
    - Use settings when a durable preference needs explanation rather than a one-time control.
    - Close the settings window before resuming the main control tour.
    relatedEntrypointIds:
    - ringcentral.video.more.settings
  participants:
    shortScript: Participants shows the live people context for the meeting and exposes attendee-oriented controls.
    details:
    - Mention participant count only when it is verified from the UI.
    - Avoid naming attendees unless the user asks and the UI text is visible.
    relatedEntrypointIds:
    - ringcentral.video.toolbar.participants
  sharing:
    shortScript: Share starts content presentation, but the AI presenter should only describe shared content after
      verified observation.
    details:
    - Treat shared content as sensitive by default.
    - Ask for confirmation before reading private content aloud.
    relatedEntrypointIds:
    - ringcentral.video.toolbar.share
  chat:
    shortScript: Chat gives the meeting a written backchannel that can be opened without changing the main video
      state.
    details:
    - Do not read private chat text by default.
    - Use chat status only as UI context unless the human asks for content.
    relatedEntrypointIds:
    - ringcentral.video.toolbar.chat
  leaveMeeting:
    shortScript: Leave is the exit path for the meeting and should be explained without clicking during a normal
      demo.
    details:
    - Ask for explicit confirmation before clicking Leave.
    - Distinguish leaving the meeting from ending a meeting for everyone when the UI exposes that choice.
    relatedEntrypointIds:
    - ringcentral.video.toolbar.leave
qa:
- question: How do I protect my real background?
  answer: Open Settings, choose Background, and select Blur or a virtual background. Blur is the safest default
    for privacy because it hides room detail while keeping the person visible.
  relatedEntrypointIds:
  - ringcentral.video.settings.background
  - ringcentral.video.settings.background.blur
- question: Can the presenter describe shared-screen content?
  answer: Only after the content is captured by an approved observation source and the user allows it. The default
    policy is to avoid inferring or reading private shared content.
  relatedEntrypointIds:
  - ringcentral.video.toolbar.share
- question: How can I bring people into the meeting?
  answer: Use Invite to add coworkers or copy meeting details. The presenter should avoid reading private invite
    links aloud unless explicitly requested.
  relatedEntrypointIds:
  - ringcentral.video.toolbar.invite
manualControls:
- name: say
  examples:
  - 'say: explain privacy benefits'
  - 'say: summarize the background options'
  handling: Replace the next scripted narration with the provided text.
- name: skip
  examples:
  - skip
  - 'skip: participants panel'
  handling: Skip the current or matching upcoming demo step.
- name: focus
  examples:
  - 'focus: chat'
  - 'focus: background'
  handling: Prefer the matching entry point or explainer for the next response.
