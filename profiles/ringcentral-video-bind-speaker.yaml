id: ringcentral-video-bind-speaker
type: desktop

launch:
  appProcess: RingCentralDevelop
  requireAlreadyLoggedIn: false
  steps: []

bind:
  process: RingCentralVideo
  windowClass: RingCentralVideoClass
  timeoutMs: 30000

observe:
  intervalMs: 1000
  sources:
    - screenshot
    - windowsUiAutomation
    - windowMetadata

events:
  - meeting_joined
  - mic_state_changed
  - camera_state_changed
  - participant_count_changed
  - dialog_appeared
  - connection_warning

narration:
  style: concise_presenter
  maxSentences: 2
  minSecondsBetweenUtterances: 4
  repeatCooldownSeconds: 30
  confidenceThreshold: 0.75
  forbidSharedScreenInterpretation: true
  soulPath: ../presenter/soul.md
  memoryPath: ../presenter/memory.md
  skillPaths:
    - ../presenter/skills/app-director.md
    - ../presenter/skills/live-explainer.md
    - ../presenter/skills/ringcentral-onboarding.md
    - ../presenter/skills/ringcentral-safety.md

audio:
  output: speaker
  speakerDevice: default

providers:
  vision: fake
  narration: fake
  speech: windows-sapi-en
