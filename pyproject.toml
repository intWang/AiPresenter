[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-presenter"
version = "0.1.0"
description = "Config-driven AI presenter for desktop and browser app profiles"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "rich>=13.7.0",
  "psutil>=5.9.8",
  "pywinauto>=0.6.8",
  "uiautomation>=2.0.20",
  "mss>=9.0.1",
  "Pillow>=10.3.0",
  "sounddevice>=0.4.6",
  "soundfile>=0.12.1",
  "numpy>=1.26.0",
  "openai>=1.99.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "pip-audit>=2.7.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
ai-presenter = "ai_presenter.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ai_presenter --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
